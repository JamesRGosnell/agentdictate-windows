[package]
name = "agentdictate-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
desktop = ["agentdictate-ui/desktop"]

[dependencies]
agentdictate-core.workspace = true
agentdictate-linux = { workspace = true, features = ["native-hotkey"] }
agentdictate-runtime.workspace = true
agentdictate-ui.workspace = true
anyhow.workspace = true
base64 = "0.22"
chrono.workspace = true
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
signal-hook = "0.3.18"
thiserror.workspace = true
tracing.workspace = true
tracing-appender = "0.2.4"
tracing-subscriber = "0.3.23"
uuid.workspace = true
tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3.23"

[[bin]]
name = "agentdictated"
path = "src/bin/agentdictated.rs"
required-features = ["desktop"]

[[bin]]
name = "agentdictate"
path = "src/bin/agentdictate.rs"
required-features = ["desktop"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Console", "Win32_System_StationsAndDesktops", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }

[target.'cfg(unix)'.dependencies]
ksni = { version = "0.3.6", features = ["blocking"] }

[target.'cfg(unix)'.dev-dependencies]
evdev = "0.13.2"

[target.'cfg(windows)'.dependencies.cpal]
version = "0.16"

[target.'cfg(windows)'.dependencies.hound]
version = "3.5"

[target.'cfg(windows)'.dependencies.notify]
version = "8"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Foundation"]

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
